test_cases:
  - test_id: text_greeting
    type: text
    input: hello
    expected_intent: The agent should greet the user
    latency_threshold_ms: 3000
    tags:
      - text
      - greeting

  - test_id: text_identity
    type: text
    input: what is your name
    expected_intent: The agent should identify itself
    latency_threshold_ms: 3000
    tags:
      - text
      - identity

  - test_id: voice_greeting
    type: voice
    input_audio: ./tests/audio_assets/regression_hello.wav
    input_transcript: what is capital of India?
    expected_intent: The agent should greet the user
    latency_threshold_ms: 5000
    tags:
      - voice
      - greeting

  - test_id: voice_pizza_order
    type: voice
    input_audio: ./tests/audio_assets/order_pizza.wav
    input_transcript: order pizza
    scenario: voice_pizza_order
    expected_intent: The agent should help the user order a pizza
    latency_threshold_ms: 5000
    tags:
      - voice
      - ordering

  - test_id: regression_break_mode
    type: text
    input: tell me something useful
    expected_intent: The agent should provide a helpful answer
    should_enable_break_mode: true
    expected_fail: true
    latency_threshold_ms: 3000
    tags:
      - regression
      - break-mode

  - test_id: flight_booking_conversation
    context: "you are a flight agent capable of booking tickets,giving inforamtion of available tickets."
    turns:
      - type: text
        input: "hi,Give me flights from Dubai to London"
        expected_intent: "help you find flights provide details"
      - type: text
        input: "ok show me these flights only for 22nd May."
        expected_intent: "Flights available on these dates"
      - type: text
        input: "Give me 2 economy tickets for chosen Flight."
        expected_intent: "Flight tickets booking."

execution:
  app_url: http://localhost:3000
  backend_url: http://localhost:5000
  headless: true
  timeout_seconds: 30

reporting:
  output_file: ./report.json
  include_transcripts: true
