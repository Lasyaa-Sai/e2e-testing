name: E2E Conversational Intelligence Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  e2e-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './app/package-lock.json'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install App Dependencies
        run: |
          cd app
          npm install

      - name: Install Harness Dependencies
        run: |
          cd harness
          npm install
          npx playwright install chromium

      - name: Setup Python STT environment
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install SpeechRecognition
          # Note: SpeechRecognition uses the internal Web Speech API endpoint for recognize_google()

      - name: Start Backend
        run: |
          cd app
          npm run backend &
          # Wait for backend health check
          sleep 5

      - name: Run E2E Harness
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          cd harness
          node cli.js --config ../tests/test_cases.yaml --output ../report.json

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-intelligence-report
          path: |
            report.json
            output.wav
            output.capture.*.webm